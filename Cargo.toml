[workspace]
resolver = "3"
members = ["crates/core", "crates/bg", "xtask"]
default-members = ["crates/core", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
hammock-reader-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.release.package.xtask]
opt-level = 2
